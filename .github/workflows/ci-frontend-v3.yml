name: Frontend CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main, ttvt098-patch-1]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend-v3.yml'

  pull_request:
    branches: [main, ttvt098-patch-1]
    paths:
      - 'frontend/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Build project
        working-directory: frontend
        run: npm run build

  deploy-to-vercel:
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/ttvt098-patch-1')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"

          missing=0

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub repository secret: VERCEL_TOKEN"
            missing=1
          else
            echo "VERCEL_TOKEN is available to this workflow run."
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing GitHub repository secret: VERCEL_ORG_ID"
            missing=1
          else
            echo "VERCEL_ORG_ID is available to this workflow run."
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing GitHub repository secret: VERCEL_PROJECT_ID"
            missing=1
          else
            echo "VERCEL_PROJECT_ID is available to this workflow run."
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@54.7.1
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
