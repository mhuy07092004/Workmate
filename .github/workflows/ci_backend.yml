name: Backend CI/CD

on:
  push:
    branches: [main, ttvt098-patch-1, cicd, cicd_final]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/ci_backend.yml'
  pull_request:
    branches: [main, ttvt098-patch-1, cicd, cicd_final]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/ci_backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run tests with pytest
        run: 
          pytest tests/ -v --tb=short
      
      - name: Run linting (optional)
        run: |
          pip install flake8
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cicd' || github.ref == 'refs/heads/cicd_final')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          
      - name: Set image name
        run: echo "IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/workmate-backend" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Trigger Render deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}